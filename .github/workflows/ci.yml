name: ci

on:
  push:
  pull_request:

jobs:
  macos:
    name: lint, test, and build
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: clippy
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/scrib-aarch64-apple-darwin.tar.gz -C target/release scrib
          (cd dist && shasum -a 256 scrib-aarch64-apple-darwin.tar.gz > scrib-aarch64-apple-darwin.tar.gz.sha256)
      - name: Installer smoke test
        run: |
          SCRIB_INSTALL_BASE_URL="file://$PWD/dist" sh install.sh
          scrib --version
          test -x "$(command -v scrib)"
