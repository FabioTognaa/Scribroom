name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  macos:
    name: package and publish
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.88.0
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          [ "$(uname -m)" = "arm64" ] || { echo "expected an arm64 runner"; exit 1; }
          mkdir -p dist
          tar -czf dist/scrib-aarch64-apple-darwin.tar.gz -C target/release scrib
          (cd dist && shasum -a 256 scrib-aarch64-apple-darwin.tar.gz > scrib-aarch64-apple-darwin.tar.gz.sha256)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/* install.sh --clobber
